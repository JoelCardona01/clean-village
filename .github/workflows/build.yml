name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache compile libraries
        uses: actions/cache@v4
        with:
          path: libs
          key: libs-${{ hashFiles('tools/fetch_libs.py') }}

      - name: Download compile libraries (Minecraft, Fabric, NeoForge, Forge)
        run: python tools/fetch_libs.py libs

      - name: Build the Fabric, NeoForge and Forge jars
        env:
          CLEANVILLAGE_LIBS: libs
          JAVA_RELEASE: "25"
        run: python build.py

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: cleanvillage-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish a GitHub release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "Clean Village $GITHUB_REF_NAME" --generate-notes
